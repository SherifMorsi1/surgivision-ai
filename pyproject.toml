[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgivision-ai"
version = "0.1.0"
description = "Research-oriented surgical video analysis with pretrained computer vision models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sherif Morsi" }]
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "open-clip-torch>=2.30,<4",
    "opencv-python-headless>=4.10,<5",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "plotly>=5.24,<7",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "streamlit>=1.39,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
surgivision-demo = "surgivision.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["surgivision"]
